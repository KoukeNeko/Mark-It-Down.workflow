name: Release

# push 到 main 時（且動到會進 cask 的檔案）：
# 計算版本 -> 測試 -> 建置並上傳 zip -> 產生 cask -> 以 Homebrew 驗證 -> 推到 tap
# 版本 = VERSION（基底，例如 0.1）+ main 的 commit 數量，例如 0.1.27
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.py"
      - "packaging/**"
      - "VERSION"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false   # 排隊而不是中斷，避免發到一半被砍

env:
  TAP_REPO: KoukeNeko/homebrew-tap
  CASK: mark-it-down

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整歷史才能算 commit 數量

      - name: Require tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$HOMEBREW_TAP_TOKEN" ] || {
            echo "::error::Repository secret HOMEBREW_TAP_TOKEN is not set"; exit 1; }

      - name: Compute version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          version="$base.$(git rev-list --count HEAD)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "Releasing v$version"

      - name: Tests
        run: |
          tests/smoke.sh bash
          tests/smoke.sh zsh

      - name: Build Quick Actions zip
        run: |
          python3 build.py "$RUNNER_TEMP/pkg" en
          (cd "$RUNNER_TEMP/pkg" && zip -qry -X "$RUNNER_TEMP/Mark-It-Down-$VERSION.zip" ./*.workflow)
          unzip -l "$RUNNER_TEMP/Mark-It-Down-$VERSION.zip"

      - name: Create GitHub release and upload zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="$RUNNER_TEMP/Mark-It-Down-$VERSION.zip"
          # 先建草稿並附上檔案，再發布（相容「發布後不可再改」的 immutable release 設定）
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" --draft --target "$GITHUB_SHA" --generate-notes
          fi
          # 草稿的檔案不是公開的（cask 下載會 404），所以一定要發布
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false
          fi

      - name: Render cask
        run: |
          packaging/render-cask.sh "$GITHUB_REPOSITORY" "$TAG" > "$RUNNER_TEMP/$CASK.rb"
          cat "$RUNNER_TEMP/$CASK.rb"

      - name: Verify cask with Homebrew
        run: |
          brew tap-new --no-git local/verify
          mkdir -p "$(brew --repository local/verify)/Casks"   # tap-new 只建 Formula/
          cp "$RUNNER_TEMP/$CASK.rb" "$(brew --repository local/verify)/Casks/$CASK.rb"
          brew audit --cask "local/verify/$CASK"
          brew install --cask "local/verify/$CASK"
          test -d "$HOME/Library/Services/Mark It Down - Copy to Clipboard.workflow"
          test -d "$HOME/Library/Services/Mark It Down - Save as Markdown File.workflow"
          brew uninstall --cask "local/verify/$CASK"
          test ! -e "$HOME/Library/Services/Mark It Down - Copy to Clipboard.workflow"

      - name: Publish cask to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git rev-parse --verify -q HEAD >/dev/null || git checkout -B main   # 全新的空 repo
          branch="$(git symbolic-ref --short HEAD)"
          mkdir -p Casks
          cp "$RUNNER_TEMP/$CASK.rb" "Casks/$CASK.rb"
          git rm -q --ignore-unmatch "Formula/$CASK.rb"   # 清掉舊的 formula 版本
          git add Casks
          if git diff --cached --quiet; then
            echo "Cask already up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$CASK $VERSION"
          git push origin "HEAD:$branch"
