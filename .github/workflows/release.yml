name: Release

# 推 v* tag 時：驗證 -> 建立 GitHub release -> 產生 formula -> 以 Homebrew 驗證 -> 推到 tap
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAP_REPO: KoukeNeko/homebrew-tap
  FORMULA: mark-it-down

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$HOMEBREW_TAP_TOKEN" ] || {
            echo "::error::Repository secret HOMEBREW_TAP_TOKEN is not set"; exit 1; }

      - name: Tag must match VERSION
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)" ] || {
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      - name: Tests
        run: |
          tests/smoke.sh bash
          tests/smoke.sh zsh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

      - name: Render formula
        run: |
          packaging/render-formula.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > "$RUNNER_TEMP/$FORMULA.rb"
          cat "$RUNNER_TEMP/$FORMULA.rb"

      - name: Verify formula with Homebrew
        run: |
          brew tap-new --no-git local/verify
          cp "$RUNNER_TEMP/$FORMULA.rb" "$(brew --repository local/verify)/Formula/$FORMULA.rb"
          brew install "local/verify/$FORMULA"
          brew test "local/verify/$FORMULA"
          brew audit --formula "local/verify/$FORMULA"

      - name: Publish formula to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git rev-parse --verify -q HEAD >/dev/null || git checkout -B main   # 全新的空 repo
          branch="$(git symbolic-ref --short HEAD)"
          mkdir -p Formula
          cp "$RUNNER_TEMP/$FORMULA.rb" "Formula/$FORMULA.rb"
          git add Formula
          if git diff --cached --quiet; then
            echo "Formula already up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$FORMULA ${GITHUB_REF_NAME#v}"
          git push origin "HEAD:$branch"
